name: Close Stale Dependency PRs

# Closes Dependabot PRs with no activity for 30 days, leaving an explanatory
# comment first (issue #268). Non-Dependabot PRs are never touched.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  close-stale:
    name: Close PRs idle for 30 days
    runs-on: ubuntu-latest
    steps:
      - name: Close stale Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const stale = prs.filter(
              (pr) =>
                pr.user &&
                pr.user.login === "dependabot[bot]" &&
                new Date(pr.updated_at).getTime() < cutoff
            );
            for (const pr of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: "Closing this dependency update: no review activity for 30 days. Reopen this PR or trigger a fresh Dependabot check (Settings → Dependabot → Check for updates) if it is still wanted.",
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "closed",
              });
            }
            core.info(`Closed ${stale.length} stale Dependabot PR(s).`);
