name: Dispute E2E Journey

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: dispute-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispute-e2e:
    name: Dispute E2E Journey (#96)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: STELLAR
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      DATABASE_URL: postgresql://user:password@localhost:5432/stellar
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_SERVER_SECRET_KEY: SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      USDC_ASSET_CODE: USDC
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      TERMII_API_KEY: placeholder
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start app in background
        run: npm start &

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run dispute E2E tests
        run: npx playwright test e2e/dispute.spec.ts --project=chromium --reporter=github

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dispute-e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
