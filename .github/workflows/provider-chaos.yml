name: Provider Chaos Tests

# Runs chaos/resilience tests for every external provider the app depends on:
# Paystack, Stellar/Horizon, Termii SMS, and the FX rate API.
# Validates circuit-breaker behaviour, retry logic, fallback paths, and
# boundary cases so regressions are caught before they reach production.
# Closes #99.

on:
  push:
    branches: [main, develop]
    paths:
      - "src/lib/**"
      - "src/__tests__/**"
      - ".github/workflows/provider-chaos.yml"
  pull_request:
    branches: [main, develop]

concurrency:
  group: provider-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Provider chaos unit tests
  #    Pure Jest tests: no real network, no DB, fast (<60 s).
  # ──────────────────────────────────────────────────────────────────────────
  provider-chaos-unit:
    name: Provider Chaos – Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run provider chaos tests
        run: |
          npx jest \
            --testPathPattern="provider-chaos" \
            --passWithNoTests \
            --forceExit \
            --reporters=default \
            --coverage \
            --coverageDirectory=coverage/provider-chaos \
            --collectCoverageFrom="src/lib/circuit-breaker.ts,src/lib/paystack.ts,src/lib/sms.ts,src/lib/fx.ts"

      - name: Upload chaos test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-chaos-coverage
          path: coverage/provider-chaos/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Circuit-breaker unit tests
  #    Runs the complete circuit-breaker test file (if it exists separately)
  #    in addition to the chaos suite.
  # ──────────────────────────────────────────────────────────────────────────
  circuit-breaker:
    name: Circuit Breaker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run circuit-breaker tests
        run: |
          npx jest \
            --testPathPattern="circuit-breaker|provider-chaos" \
            --passWithNoTests \
            --forceExit

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Full test suite with chaos coverage gate
  #    Ensures provider/chaos tests don't regress overall coverage.
  # ──────────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate (with chaos tests)
    runs-on: ubuntu-latest
    needs: [provider-chaos-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite with coverage
        run: npm test -- --coverage --passWithNoTests

      - name: Check circuit-breaker coverage
        run: |
          node -e "
            const fs = require('fs');
            const summaryPath = 'coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('Coverage summary not found — skipping gate');
              process.exit(0);
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const cbFile = Object.entries(summary).find(([k]) =>
              k.includes('circuit-breaker')
            );
            if (!cbFile) {
              console.log('circuit-breaker.ts not in coverage report — skipping');
              process.exit(0);
            }
            const [, data] = cbFile;
            const { lines, functions, branches, statements } = data;
            const threshold = 80;
            const failures = [];
            if (lines.pct     < threshold) failures.push('lines: '      + lines.pct.toFixed(1)     + '% < ' + threshold + '%');
            if (functions.pct < threshold) failures.push('functions: '  + functions.pct.toFixed(1) + '% < ' + threshold + '%');
            if (branches.pct  < threshold) failures.push('branches: '   + branches.pct.toFixed(1)  + '% < ' + threshold + '%');
            if (statements.pct< threshold) failures.push('statements: ' + statements.pct.toFixed(1)+ '% < ' + threshold + '%');
            if (failures.length) {
              console.error('circuit-breaker.ts coverage below 80%:\\n  ' + failures.join('\\n  '));
              process.exit(1);
            }
            console.log('circuit-breaker.ts coverage OK (' +
              lines.pct.toFixed(1) + '% lines, ' +
              functions.pct.toFixed(1) + '% functions)');
          "

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: chaos

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Provider documentation check
  #    Verifies that the incident runbook references all providers so that
  #    on-call engineers have playbooks when a provider goes down.
  # ──────────────────────────────────────────────────────────────────────────
  provider-docs-check:
    name: Provider Runbook Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify incident-runbook.md covers all providers
        run: |
          missing=()
          for provider in "Paystack" "Stellar" "Termii" "Redis"; do
            if ! grep -qi "$provider" docs/incident-runbook.md; then
              missing+=("$provider")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "ERROR: docs/incident-runbook.md is missing provider coverage:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All providers documented in incident-runbook.md ✓"

      - name: Verify circuit-breaker is documented in backend-hardening
        run: |
          if ! grep -q "circuit.breaker\|CircuitBreaker" docs/BACKEND_HARDENING.md; then
            echo "ERROR: docs/BACKEND_HARDENING.md does not document the circuit breaker."
            exit 1
          fi
          echo "Circuit breaker documented in BACKEND_HARDENING.md ✓"
