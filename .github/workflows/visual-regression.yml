name: Visual Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:  # least-privilege CI tokens (#108)
  contents: read

jobs:
  visual-regression:
    name: Visual Regression (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: desktop
            playwright_project: visual-desktop
          - viewport: mobile
            playwright_project: visual-mobile
          - viewport: tablet
            playwright_project: visual-tablet

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: STELLAR
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      DATABASE_URL: postgresql://user:password@localhost:5432/stellar
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_SERVER_SECRET_KEY: SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      USDC_ASSET_CODE: USDC
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      TERMII_API_KEY: placeholder
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Start server
        run: npx next start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run visual regression tests — ${{ matrix.viewport }}
        run: npx playwright test --project=${{ matrix.playwright_project }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report-${{ matrix.viewport }}
          path: playwright-report/
          retention-days: 30

      - name: Post failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const viewport = '${{ matrix.viewport }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ⚠️ Visual Regression Failure — ${viewport}`,
                '',
                `One or more visual baseline comparisons failed on the **${viewport}** viewport.`,
                '',
                `**Diff artefact:** [visual-regression-report-${viewport}](${runUrl})`,
                '',
                '### If the change is intentional',
                '```bash',
                `npm run test:visual:update -- --project=visual-${viewport}`,
                '```',
                'Commit the updated snapshots and push.',
              ].join('\n'),
            });
