name: Secret Rotation Reminder

# Managed secret rotation, for CI/deployment secrets, is a process problem
# more than a code problem: nothing in this repo can reach into Paystack,
# Termii, Stellar, AWS or Vercel and rotate a credential on its own without
# owner-level access this repo doesn't hold. What CI *can* do is guarantee
# the rotation process never gets silently forgotten — so this opens (or
# refreshes) a single tracking issue every quarter, checklist-style, linking
# to docs/SECRET_ROTATION.md for the actual per-secret steps.

on:
  schedule:
    - cron: "0 6 1 */3 *"  # 06:00 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-reminder:
    name: Open/refresh rotation tracking issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- secret-rotation-reminder -->';
            const title = 'Quarterly secret rotation';
            const secrets = [
              'STAGING_NEXTAUTH_SECRET',
              'STAGING_DATABASE_URL / DATABASE_URL',
              'STELLAR_TESTNET_SECRET_KEY / STELLAR_SERVER_SECRET_KEY',
              'STAGING_PAYSTACK_SECRET_KEY',
              'STAGING_TERMII_API_KEY',
              'STAGING_REDIS_URL',
              'STAGING_CRON_SECRET / CRON_SECRET',
              'SENTRY_DSN / SENTRY_AUTH_TOKEN',
              'VERCEL_TOKEN',
              'AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY',
              'SLACK_WEBHOOK_URL',
            ];
            const checklist = secrets.map(s => `- [ ] ${s}`).join('\n');
            const body = `${marker}\nTime to review and rotate CI/deployment secrets. See [docs/SECRET_ROTATION.md](../blob/main/docs/SECRET_ROTATION.md) for the procedure for each one.\n\n${checklist}\n\nCheck each box once that secret has been rotated (or confirmed not due this cycle) and the dependent workflow has been re-verified green. Close this issue once every box is checked; the next scheduled run will open a fresh one.`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secret-rotation',
            });
            const existing = openIssues.find(i => i.body && i.body.includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Reminder: this rotation cycle is still open.',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['secret-rotation', 'devops'],
              });
            }
