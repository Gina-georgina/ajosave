name: Realtime Integration Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: realtime-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:  # least-privilege CI tokens (#108)
  contents: read

jobs:
  realtime-integration:
    name: Realtime Integration Tests
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: STELLAR
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      DATABASE_URL: postgresql://user:password@localhost:5432/stellar
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_SERVER_SECRET_KEY: SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      USDC_ASSET_CODE: USDC
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      TERMII_API_KEY: placeholder
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Run realtime integration tests
        run: npx jest --testPathPattern="realtime-integration" --runInBand --forceExit 2>&1 | tee /tmp/realtime-test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-integration-results
          path: /tmp/realtime-test-results.txt
          retention-days: 14
