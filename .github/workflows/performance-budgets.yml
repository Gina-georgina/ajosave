name: Performance Budgets

# Enforces bundle-size, latency SLO, and Lighthouse score budgets.
# Runs on every PR and on merges to main/develop.
# Closes #98.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: perf-budgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Bundle-size gate
  #    Runs after a full Next.js build and checks gzipped JS against the
  #    limits in bundle-budget.json.
  # ──────────────────────────────────────────────────────────────────────────
  bundle-size:
    name: Bundle Size Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: STELLAR
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      DATABASE_URL: postgresql://user:password@localhost:5432/stellar
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_SERVER_SECRET_KEY: SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      USDC_ASSET_CODE: USDC
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      TERMII_API_KEY: placeholder
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Check bundle budgets
        id: bundle_check
        run: |
          npm run bundle:check 2>&1 | tee bundle-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Annotate PR with bundle results
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f bundle-report.txt ]; then
            {
              echo "### Bundle Size Report"
              echo '```'
              head -60 bundle-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if budget exceeded
        if: steps.bundle_check.outputs.exit_code != '0'
        run: |
          echo "❌ Bundle budget exceeded. See bundle-report.txt for details."
          exit 1

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-size-report
          path: bundle-report.txt
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Performance budget unit tests
  #    Runs the Jest suite for bundle-budget logic and latency SLO constants.
  # ──────────────────────────────────────────────────────────────────────────
  performance-budget-tests:
    name: Performance Budget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run performance budget tests
        run: |
          npx jest \
            --testPathPattern="performance-budgets" \
            --passWithNoTests \
            --forceExit \
            --reporters=default

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Lighthouse CI score gate (HTML export)
  #    Validates performance ≥ 0.85, accessibility ≥ 0.90 (as configured in
  #    .lighthouserc.json). Only runs when source files change.
  # ──────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse Score Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: STELLAR
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-placeholder
      DATABASE_URL: postgresql://user:password@localhost:5432/stellar
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      STELLAR_SERVER_SECRET_KEY: SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      USDC_ASSET_CODE: USDC
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      TERMII_API_KEY: placeholder
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and export static pages
        run: |
          npm run build
          # Export static HTML for Lighthouse analysis
          npx next export --outdir out 2>/dev/null || \
            cp -r .next/server/app out 2>/dev/null || \
            echo "Static export skipped – app uses dynamic routes"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true # Score failures are advisory on PRs; bundle-size is the hard gate

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Latency SLO documentation check
  #    Ensures payment-threat-model.md contains the required SLO table so the
  #    constants in the test file stay in sync with documentation.
  # ──────────────────────────────────────────────────────────────────────────
  slo-docs-check:
    name: Latency SLO Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify payment-threat-model.md contains SLO section
        run: |
          if ! grep -q "SLO\|latency\|p99\|p95" docs/payment-threat-model.md; then
            echo "ERROR: docs/payment-threat-model.md is missing SLO/latency documentation."
            exit 1
          fi
          echo "SLO documentation present in payment-threat-model.md ✓"

      - name: Verify bundle-budget.json has correct schema
        run: |
          node -e "
            const b = JSON.parse(require('fs').readFileSync('bundle-budget.json', 'utf8'));
            if (!b.perRoute || b.perRoute <= 0) throw new Error('perRoute missing or ≤ 0');
            if (!b.total   || b.total   <= 0) throw new Error('total missing or ≤ 0');
            if (b.total <= b.perRoute) throw new Error('total should be greater than perRoute');
            console.log('bundle-budget.json schema OK ✓');
          "
