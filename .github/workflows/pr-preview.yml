name: PR Preview Deployment

# Deploys a Vercel preview build for every pull request and comments the
# preview URL back on the PR, updating the comment on each new push instead
# of spamming a new one. Reuses the same Vercel project already wired up in
# staging-deploy.yml (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID) and
# the staging-flavored env vars, since previews run against testnet.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:  # least-privilege CI tokens (#108)
  contents: read
  pull-requests: write   # post/update preview URL comment
  deployments: write     # create GitHub Deployment for preview

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_APP_NAME: "Ajosave PR Preview"
          NEXTAUTH_URL: ${{ vars.STAGING_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_AJO_CONTRACT_ID: ${{ secrets.STELLAR_TESTNET_CONTRACT_ID }}
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
          STELLAR_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: ${{ secrets.STAGING_PAYSTACK_SECRET_KEY }}
          TERMII_API_KEY: ${{ secrets.STAGING_TERMII_API_KEY }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}

      - name: Deploy to Vercel (Preview)
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prebuilt"
          github-comment: false

      - name: Comment preview URL on PR
        if: always() && steps.vercel.outputs.preview-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview-url }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n## 🔎 PR Preview\n\n| Environment | URL |\n|-------------|-----|\n| Preview | ${process.env.PREVIEW_URL} |\n\nDeployed from commit ${context.payload.pull_request.head.sha.substring(0, 7)}. This preview runs against Stellar **testnet** and is rebuilt on every push to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Note missing preview URL
        if: always() && steps.vercel.outputs.preview-url == ''
        run: |
          echo "::warning::Vercel did not return a preview URL. Verify VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets are configured for this repo/fork."
